<!doctype html>
<html lang="lt">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- viewport-fit=cover is required for CSS env(safe-area-inset-*) to
         report real, non-zero values on phones with a gesture-navigation
         bar or notch — without it those env() values are always 0px,
         even on a device that actually has one. Added alongside
         CellHoverEditor.tsx's own place() using this, so a popup's
         buttons don't end up rendered inside that system gesture area,
         where taps get intercepted by the OS/browser chrome instead of
         ever reaching the page. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MyDesk</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Zadarma's WebRTC softphone widget loader — static, no secret in
         these; the actual per-session key is fetched from our own local
         proxy at runtime (components/Softphone.tsx) and passed into
         window.zadarmaWidgetFn, which these two scripts define. This exact
         v9/sub_v=1 URL is what Zadarma's own dashboard (My Zadarma →
         Settings → Integrations and API → WebRTC widget integration)
         generated for this account once the integration was enabled there
         — don't casually "clean up" back to an older v8 URL found via a
         generic doc/blog post, the dashboard-issued one is authoritative
         for whatever's actually enabled on this account. -->
    <script src="https://my.zadarma.com/webphoneWebRTCWidget/v9/js/loader-phone-lib.js?sub_v=1"></script>
    <script src="https://my.zadarma.com/webphoneWebRTCWidget/v9/js/loader-phone-fn.js?sub_v=1"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
